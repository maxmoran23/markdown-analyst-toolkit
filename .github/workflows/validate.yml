name: Validate attachment suites
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 python-docx==1.2.0
      - run: python _maintainer/validate.py
      - run: python _maintainer/test_renderers.py
      - run: python _maintainer/package.py
