name: Validate attachment suites
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 python-docx==1.2.0
      - run: python _maintainer/validate.py
      - run: python _maintainer/test_schema.py
      - run: python _maintainer/test_domain_contracts.py
      - run: python _maintainer/test_process_cases.py
      - run: python _maintainer/test_renderers.py
      - run: python _maintainer/test_packages.py
